name: Build Geode Mod & Run Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  unit-tests:
    name: Core Unit Tests (C++23)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure and Build Core Tests
        run: |
          cmake -B build-tests -DFFC_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-tests --config Release
      - name: Run Core Unit Tests
        run: ./build-tests/ffc_core_tests

  build:
    name: Build Geode Package (${{ matrix.target }})
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: Win64
          - os: macos-latest
            target: MacOS
          - os: ubuntu-latest
            target: Android64
          - os: ubuntu-latest
            target: Android32
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build Geode Mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.target }}
          combine: true

      - name: Surface Compiler Diagnostics on Failure
        if: failure()
        shell: bash
        run: |
          if [ -d build ]; then
            cmake --build build --config Release 2>&1 | grep -E "error:|fatal error:|undefined|CMake Error" | head -n 20 | while IFS= read -r line; do
              echo "::error title=Compiler Error::$line"
            done
          fi

  combine:
    name: Combine & Publish Geode Package
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Combine Platform Packages
        id: combine
        uses: geode-sdk/build-geode-mod/combine@main
        with:
          zstd: false

      - name: Verify Combined .geode Package
        shell: bash
        run: |
          ls -lh "${{ steps.combine.outputs.build-output }}"
          unzip -l "${{ steps.combine.outputs.build-output }}/nananqj96.fake-frame-counter.geode"

      - name: Upload Combined Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FakeFrameCounter-Geode
          path: ${{ steps.combine.outputs.build-output }}/nananqj96.fake-frame-counter.geode

      - name: Publish GitHub Release v1.0.0 and Commit .geode Binary
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          GEODE_FILE="${{ steps.combine.outputs.build-output }}/nananqj96.fake-frame-counter.geode"
          cp "$GEODE_FILE" ./nananqj96.fake-frame-counter.geode

          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 ./nananqj96.fake-frame-counter.geode --clobber
          else
            gh release create v1.0.0 ./nananqj96.fake-frame-counter.geode \
              --target "${{ github.sha }}" \
              --title "Fake Frame Counter v1.0.0 (GD 2.2081 / Geode v5.11.2)" \
              --notes "Compiled multi-platform Geode mod package (\`nananqj96.fake-frame-counter.geode\`) for Geometry Dash 2.2081 (Windows 64-bit, macOS, Android 64-bit, Android 32-bit)."
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nananqj96.fake-frame-counter.geode
          if ! git diff --cached --quiet; then
            git commit -m "Add compiled nananqj96.fake-frame-counter.geode artifact [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
